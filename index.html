<!DOCTYPE html>
<html>
<head>
  <style>
    /* মেইন কন্টেইনার */
    .image-container {
      position: relative;
      display: inline-block;
    }
    /* ছবি */
    .image-container img {
      width: 100%;
      max-width: 500px; /* প্রয়োজন অনুযায়ী ছবির সাইজ কম-বেশি করতে পারেন */
      display: block;
    }

    /* মাঝখানের লেখা */
    .text-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000000;       /* লেখার রঙ (কালো) */
      font-size: 12px;      /* লেখার সাইজ */
      font-weight: bold;    /* লেখা মোটা করার জন্য */
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="image-container">
    <!-- আপনার ছবির ফাইল নেম বা লিংক এখানে বসাবেন -->
    <img src="https://raw.githubusercontent.com/shafiurrahman99/Pad/main/Alnawa%20pad.jpeg" alt="Alnawa Pad">
    
    <!-- মাঝখানের লেখা -->
    <div class="text-center">

<!-- Authentication Box (Sign In / Sign Up) -->
      <div id="auth-section" class="card">
        <div class="auth-tabs">
          <button class="tab-btn active" id="btn-signin-tab" onclick="switchTab('signin')">সাইন ইন</button>
          <button class="tab-btn" id="btn-signup-tab" onclick="switchTab('signup')">সাইন আপ</button>
        </div>

        <!-- Sign In Form -->
        <form id="signin-form" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signin-userid" placeholder="আপনার ইউজার আইডি লিখুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signin-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন ইন করুন</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="hidden" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label>সম্পূর্ণ নাম</label>
            <input type="text" id="signup-name" placeholder="আপনার নাম লিখুন" required>
          </div>
          <div class="form-group">
            <label>ইমেইল এড্রেস</label>
            <input type="email" id="signup-email" placeholder="example@mail.com" required>
          </div>
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signup-userid" placeholder="নতুন ইউজার আইডি তৈরি করুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signup-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন আপ করুন</button>
        </form>
      </div>


  </div>

</body>
</html>
