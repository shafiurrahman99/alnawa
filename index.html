<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মেসার্স আল নাওয়া কোম্পানী - ড্যাশবোর্ড</title>
  <!-- Google Fonts for Bengali -->
  <link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #15803d;
      --secondary-blue: #1e3a8a;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', 'Kalpurush', Arial, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    /* ১. মূল প্যাডের ফ্রেম (position: relative) */
    .pad-box {
      position: relative;
      width: 850px;
      background-color: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* ২. প্যাডের আসল ব্যাকগ্রাউন্ড ছবি */
    .pad-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ৩. প্যাডের মাঝখানের ফাঁকা সাদা অংশে বসানো মূল ওভারলে বক্স (position: absolute) */
    .middle-overlay {
      position: absolute;
      top: 360px;     /* ওপরের হেডার ও লোগো বাদ দিয়ে ৩৬০ পিক্সেল নিচে শুরু */
      left: 45px;     /* বাম দিক থেকে ফাঁকা জায়গা */
      right: 45px;    /* ডান দিক থেকে ফাঁকা জায়গা */
      bottom: 140px;  /* নিচের ফুটার/ঠিকানা বাদ দিয়ে ১৪০ পিক্সেল ওপরে শেষ */
      
      overflow-y: auto; /* কন্টেন্ট বেশি হলে মাঝখানের সাদা অংশের ভেতরেই স্ক্রোল হবে */
      padding: 10px;
      background: rgba(255, 255, 255, 0.85); /* মাঝের জলছাপের ওপর হালকা স্বচ্ছ ব্যাকগ্রাউন্ড */
      border-radius: 8px;
    }

    /* কার্ড ও ফর্মের স্টাইল */
    .card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      font-size: 15px;
    }

    .tab-btn.active {
      background: var(--primary-green);
      color: white;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1e293b;
      font-size: 13px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 8px;
      background-color: var(--secondary-blue);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary-green);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .summary-box {
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      color: white;
    }

    .bg-approved { background: linear-gradient(135deg, #15803d, #166534); }
    .bg-pending { background: linear-gradient(135deg, #d97706, #b45309); }

    .summary-box h4 { font-size: 13px; margin-bottom: 4px; opacity: 0.9; }
    .summary-box p { font-size: 18px; font-weight: bold; }

    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: white;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px;
      text-align: center;
    }

    th { background-color: #f1f5f9; color: #0f172a; font-weight: 700; }

    .badge {
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }

    .badge-canceled { background-color: #fee2e2; color: #dc2626; }
    .badge-pending { background-color: #fef3c7; color: #d97706; }
    .badge-approved { background-color: #dcfce7; color: #15803d; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ১. প্যাডের মেইন বক্স কন্টেইনার -->
  <div class="pad-box">
    
    <!-- আপনার ব্যাকগ্রাউন্ড প্যাডের ছবি -->
    <img src="https://images.canvas.intellect.app/1000244496.jpg" class="pad-image" alt="M/S Alnawa Company Pad">

    <!-- ২. প্যাডের ঠিক মাঝখানের সাদা ঘরে কন্টেন্ট ওভারলে -->
    <div class="middle-overlay">

      <!-- সাইন-ইন / সাইন-আপ কার্ড -->
      <div id="auth-section" class="card">
        <div class="auth-tabs">
          <button class="tab-btn active" id="btn-signin-tab" onclick="switchTab('signin')">সাইন ইন</button>
          <button class="tab-btn" id="btn-signup-tab" onclick="switchTab('signup')">সাইন আপ</button>
        </div>

        <!-- সাইন ইন ফর্ম -->
        <form id="signin-form" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signin-userid" placeholder="আপনার ইউজার আইডি লিখুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signin-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন ইন করুন</button>
        </form>

        <!-- সাইন আপ ফর্ম -->
        <form id="signup-form" class="hidden" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label>সম্পূর্ণ নাম</label>
            <input type="text" id="signup-name" placeholder="আপনার নাম লিখুন" required>
          </div>
          <div class="form-group">
            <label>ইমেইল এড্রেস</label>
            <input type="email" id="signup-email" placeholder="example@mail.com" required>
          </div>
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signup-userid" placeholder="নতুন ইউজার আইডি তৈরি করুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signup-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন আপ করুন</button>
        </form>
      </div>

      <!-- ড্যাশবোর্ড সেকশন -->
      <div id="dashboard-section" class="hidden">
        
        <!-- ইউজার বার -->
        <div class="user-bar">
          <div><strong>ইউজার আইডি:</strong> <span id="display-user-id"></span></div>
          <button onclick="handleLogOut()" style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">লগ আউট</button>
        </div>

        <!-- টাকা জমার আবেদন ফর্ম -->
        <div class="card">
          <h4 style="margin-bottom: 10px; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">টাকা জমার আবেদন</h4>
          <form onsubmit="handleDepositSubmit(event)">
            <div class="form-group">
              <label>ইউজার আইডি</label>
              <input type="text" id="deposit-userid" readonly style="background: #f1f5f9;">
            </div>
            <div class="form-group">
              <label>বিবরণী</label>
              <input type="text" id="deposit-details" placeholder="জমার কারণ লিখুন" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <div class="form-group">
                <label>দাতা ব্যাংক</label>
                <input type="text" id="deposit-sender-bank" placeholder="প্রেনণকারী ব্যাংক" required>
              </div>
              <div class="form-group">
                <label>গ্রহীতা ব্যাংক</label>
                <input type="text" id="deposit-receiver-bank" placeholder="গ্রহণকারী ব্যাংক" required>
              </div>
            </div>
            <div class="form-group">
              <label>জমার পরিমাণ (টাকা)</label>
              <input type="number" id="deposit-amount" min="1" placeholder="০.০০" required>
            </div>
            <button type="submit" class="btn-submit" style="background-color: var(--primary-green);">জমা সাবমিট করুন</button>
          </form>
        </div>

        <!-- টোটাল সামারি বক্স -->
        <div class="summary-grid">
          <div class="summary-box bg-approved">
            <h4>টোটাল অ্যাপ্রুভ জমা</h4>
            <p id="total-approved-amount">৳ ০</p>
          </div>
          <div class="summary-box bg-pending">
            <h4>টোটাল পেন্ডিং জমা</h4>
            <p id="total-pending-amount">৳ ০</p>
          </div>
        </div>

        <!-- লেনদেনের রিয়েল-টাইম টেবিল -->
        <div class="card">
          <h4 style="margin-bottom: 8px; color: var(--secondary-blue);">লেনদেনের তালিকা</h4>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>তারিখ</th>
                  <th>বিবরণী</th>
                  <th>দাতা ব্যাংক</th>
                  <th>গ্রহীতা ব্যাংক</th>
                  <th>স্ট্যাটাস</th>
                  <th>পরিমাণ</th>
                  <th>যোগফল</th>
                </tr>
              </thead>
              <tbody id="transaction-rows"></tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- সম্পূর্ণ জাভাস্ক্রিপ্ট লজিক -->
  <script>
    let currentUser = null;
    
    let users = JSON.parse(localStorage.getItem('al_nawa_users')) || {
      'user123': { name: 'রহিম আহমেদ', email: 'rahim@gmail.com', password: '123' }
    };
