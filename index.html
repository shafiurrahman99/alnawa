<!DOCTYPE html>
<html>
<head>
  <style>
    /* মেইন কন্টেইনার */
    .image-container {
      position: relative;
      display: inline-block;
    }
    /* ছবি */
    .image-container img {
      width: 100%;
      max-width: 500px; /* প্রয়োজন অনুযায়ী ছবির সাইজ কম-বেশি করতে পারেন */
      display: block;
    }

    /* মাঝখানের লেখা */
    .text-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000000;       /* লেখার রঙ (কালো) */
      font-size: 12px;      /* লেখার সাইজ */
      font-weight: bold;    /* লেখা মোটা করার জন্য */
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="image-container">
    <!-- আপনার ছবির ফাইল নেম বা লিংক এখানে বসাবেন -->
    <img src="https://raw.githubusercontent.com/shafiurrahman99/Pad/main/Alnawa%20pad.jpeg" alt="Alnawa Pad">
    
    <!-- মাঝখানের লেখা -->
    <div class="text-center">
      <!DOCTYPE html>
<html>
<head>
 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মেসার্স আল নাওয়া কোম্পানী - ড্যাশবোর্ড</title>
  <!-- Google Fonts for Bengali -->
  <img src="https://raw.githubusercontent.com/shafiurrahman99/Pad/main/Alnawa%20pad.jpeg" alt="Alnawa Pad">
  <style>
    :root {
      --primary-green: #15803d;
      --secondary-blue: #1e3a8a;
      --bg-light: #f8fafc;
      --border-color: #cbd5e1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', 'Kalpurush', Arial, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    /* A4 Pad Container with Background Image */
    .pad-container {
      width: 850px;
      min-height: 1100px;
      background-color: #ffffff;
      background-image: url('https://images.canvas.intellect.app/1000244496.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 4 inches top margin spacing (~384px) */
    .top-pad-margin {
      height: 384px;
      flex-shrink: 0;
    }

    /* Main content inside white watermark area */
    .pad-content {
      flex: 1;
      padding: 0 45px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.85); /* Semi-transparent to read text easily over watermark */
      margin: 0 25px;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }

    /* 1.5 inches bottom margin spacing (~144px) */
    .bottom-pad-margin {
      height: 144px;
      flex-shrink: 0;
    }

    /* Card Styles */
    .card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    /* Auth Tab Buttons */
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      font-size: 15px;
    }

    .tab-btn.active {
      background: var(--primary-green);
      color: white;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1e293b;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-green);
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: var(--secondary-blue);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #1e40af;
    }

    /* Dashboard Top User Bar */
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary-green);
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-box {
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      color: white;
    }

    .bg-approved {
      background: linear-gradient(135deg, #15803d, #166534);
    }

    .bg-pending {
      background: linear-gradient(135deg, #d97706, #b45309);
    }

    .summary-box h4 {
      font-size: 14px;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .summary-box p {
      font-size: 20px;
      font-weight: bold;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f1f5f9;
      color: #0f172a;
      font-weight: 700;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-canceled {
      background-color: #fee2e2;
      color: #dc2626;
    }

    .badge-pending {
      background-color: #fef3c7;
      color: #d97706;
    }

    .badge-approved {
      background-color: #dcfce7;
      color: #15803d;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="pad-container">
    
    <!-- Top Padding Margin: 4 Inches -->
    <div class="top-pad-margin"></div>

    <!-- Main Watermark Overlay Content Area -->
    <div class="pad-content">

      <!-- Authentication Box (Sign In / Sign Up) -->
      <div id="auth-section" class="card">
        <div class="auth-tabs">
          <button class="tab-btn active" id="btn-signin-tab" onclick="switchTab('signin')">সাইন ইন</button>
          <button class="tab-btn" id="btn-signup-tab" onclick="switchTab('signup')">সাইন আপ</button>
        </div>

        <!-- Sign In Form -->
        <form id="signin-form" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signin-userid" placeholder="আপনার ইউজার আইডি লিখুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signin-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন ইন করুন</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="hidden" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label>সম্পূর্ণ নাম</label>
            <input type="text" id="signup-name" placeholder="আপনার নাম লিখুন" required>
          </div>
          <div class="form-group">
            <label>ইমেইল এড্রেস</label>
            <input type="email" id="signup-email" placeholder="example@mail.com" required>
          </div>
          <div class="form-group">
            <label>ইউজার আইডি</label>
            <input type="text" id="signup-userid" placeholder="নতুন ইউজার আইডি তৈরি করুন" required>
          </div>
          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="signup-password" placeholder="পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-submit">সাইন আপ করুন</button>
        </form>
      </div>

      <!-- Dashboard Section (Visible after login) -->
      <div id="dashboard-section" class="hidden">
        
        <!-- User Bar -->
        <div class="user-bar">
          <div>
            <strong>ইউজার আইডি:</strong> <span id="display-user-id"></span>
          </div>
          <button onclick="handleLogOut()" style="padding: 4px 10px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">লগ আউট</button>
        </div>

        <!-- Deposit Submit Form -->
        <div class="card">
          <h3 style="margin-bottom: 12px; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">টাকা জমার আবেদন</h3>
          <form onsubmit="handleDepositSubmit(event)">
            <div class="form-group">
              <label>ইউজার আইডি</label>
              <input type="text" id="deposit-userid" readonly style="background: #f1f5f9;">
            </div>
            <div class="form-group">
              <label>বিবরণী</label>
              <input type="text" id="deposit-details" placeholder="জমার কারণ বা বিবরণী লিখুন" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div class="form-group">
                <label>দাতা ব্যাংক (প্রেরণকারী)</label>
                <input type="text" id="deposit-sender-bank" placeholder="প্রেরণকারী ব্যাংক" required>
              </div>
              <div class="form-group">
                <label>গ্রহীতা ব্যাংক (গ্রহণকারী)</label>
                <input type="text" id="deposit-receiver-bank" placeholder="গ্রহণকারী ব্যাংক" required>
              </div>
            </div>
            <div class="form-group">
              <label>জমার পরিমাণ (টাকা)</label>
              <input type="number" id="deposit-amount" min="1" placeholder="০.০০" required>
            </div>
            <button type="submit" class="btn-submit" style="background-color: var(--primary-green);">জমা সাবমিট করুন</button>
          </form>
        </div>

        <!-- Total Amounts Summary Cards -->
        <div class="summary-grid">
          <div class="summary-box bg-approved">
            <h4>টোটাল অ্যাপ্রুভ জমা</h4>
            <p id="total-approved-amount">৳ ০</p>
          </div>
          <div class="summary-box bg-pending">
            <h4>টোটাল পেন্ডিং জমা</h4>
            <p id="total-pending-amount">৳ ০</p>
          </div>
        </div>

        <!-- Transactions Table -->
        <div class="card">
          <h3 style="margin-bottom: 10px; color: var(--secondary-blue);">লেনদেনের তালিকা (আপনার আইডি)</h3>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>তারিখ</th>
                  <th>বিবরণী</th>
                  <th>দাতা ব্যাংক</th>
                  <th>গ্রহীতা ব্যাংক</th>
                  <th>স্ট্যাটাস</th>
                  <th>টাকার পরিমাণ</th>
                  <th>ধারাবাহিক যোগফল</th>
                </tr>
              </thead>
              <tbody id="transaction-rows">
                <!-- Rows populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Padding Margin: 1.5 Inches -->
    <div class="bottom-pad-margin"></div>

  </div>

  <script>
    // State Management
    let currentUser = null;
    
    // Default Users Database in LocalStorage
    let users = JSON.parse(localStorage.getItem('al_nawa_users')) || {
      'user123': { name: 'রহিম আহমেদ', email: 'rahim@gmail.com', password: '123' }
    };

    // Default Transactions Data
    let transactions = JSON.parse(localStorage.getItem('al_nawa_transactions')) || [
      { id: 1, userId: 'user123', date: '২০২৬-১০-০১', details: 'চালান জমার টাকা', senderBank: 'ডাচ বাংলা ব্যাংক', receiverBank: 'ইসলামী ব্যাংক', status: 'Approved', amount: 50000 },
      { id: 2, userId: 'user123', date: '২০২৬-১০-০৫', details: 'অগ্রিম জমা', senderBank: 'ব্র্যাক ব্যাংক', receiverBank: 'ব্যাংক এশিয়া', status: 'Pending', amount: 20000 },
      { id: 3, userId: 'user123', date: '২০২৬-১০-০২', details: 'ভুল ইনপুট জমা', senderBank: 'সিটি ব্যাংক', receiverBank: 'ইসলামী ব্যাংক', status: 'Canceled', amount: 10000 },
      { id: 4, userId: 'user123', date: '২০২৬-১০-০৬', details: 'বিল পরিশোধ', senderBank: 'সোনালী ব্যাংক', receiverBank: 'ইসলামী ব্যাংক', status: 'Approved', amount: 15000 }
    ];

    function switchTab(tab) {
      if (tab === 'signin') {
        document.getElementById('signin-form').classList.remove('hidden');
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('btn-signin-tab').classList.add('active');
        document.getElementById('btn-signup-tab').classList.remove('active');
      } else {
        document.getElementById('signin-form').classList.add('hidden');
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('btn-signin-tab').classList.remove('active');
        document.getElementById('btn-signup-tab').classList.add('active');
      }
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const userId = document.getElementById('signup-userid').value.trim();
      const password = document.getElementById('signup-password').value;

      if (users[userId]) {
        alert('এই ইউজার আইডি ইতিপূর্বে ব্যবহার করা হয়েছে!');
        return;
      }

      users[userId] = { name, email, password };
      localStorage.setItem('al_nawa_users', JSON.stringify(users));
      alert('সাইন আপ সফল হয়েছে! এখন সাইন ইন করুন।');
      switchTab('signin');
      document.getElementById('signin-userid').value = userId;
    }

    function handleSignIn(e) {
      e.preventDefault();
      const userId = document.getElementById('signin-userid').value.trim();
      const password = document.getElementById('signin-password').value;

      if (users[userId] && users[userId].password === password) {
        currentUser = userId;
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('display-user-id').innerText = currentUser;
        document.getElementById('deposit-userid').value = currentUser;
        renderDashboard();
      } else {
        alert('ভুল ইউজার আইডি অথবা পাসওয়ার্ড!');
      }
    }

    function handleLogOut() {
      currentUser = null;
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('auth-section').classList.remove('hidden');
    }

    function handleDepositSubmit(e) {
      e.preventDefault();
      const details = document.getElementById('deposit-details').value;
      const senderBank = document.getElementById('deposit-sender-bank').value;
      const receiverBank = document.getElementById('deposit-receiver-bank').value;
      const amount = parseFloat(document.getElementById('deposit-amount').value);

      const today = new Date().toISOString().split('T')[0];

      const newTransaction = {
        id: Date.now(),
        userId: currentUser,
        date: today,
        details: details,
        senderBank: senderBank,
        receiverBank: receiverBank,
        status: 'Pending',
        amount: amount
      };

      transactions.push(newTransaction);
      localStorage.setItem('al_nawa_transactions', JSON.stringify(transactions));
      alert('আপনার জমা আবেদনের অনুরোধ সফলভাবে জমা দেওয়া হয়েছে!');
      
      document.getElementById('deposit-details').value = '';
      document.getElementById('deposit-sender-bank').value = '';
      document.getElementById('deposit-receiver-bank').value = '';
      document.getElementById('deposit-amount').value = '';

      renderDashboard();
    }

    function renderDashboard() {
      const userTx = transactions.filter(t => t.userId === currentUser);

      let totalApproved = 0;
      let totalPending = 0;

      userTx.forEach(t => {
        if (t.status === 'Approved') totalApproved += t.amount;
        if (t.status === 'Pending') totalPending += t.amount;
      });

      document.getElementById('total-approved-amount').innerText = '৳ ' + totalApproved.toLocaleString('bn-BD');
      document.getElementById('total-pending-amount').innerText = '৳ ' + totalPending.toLocaleString('bn-BD');

      // Sorting Rule: 1. Canceled, 2. Pending, 3. Approved
      const statusPriority = { 'Canceled': 1, 'Pending': 2, 'Approved': 3 };
      userTx.sort((a, b) => statusPriority[a.status] - statusPriority[b.status]);

      const tbody = document.getElementById('transaction-rows');
      tbody.innerHTML = '';

      let runningTotal = 0;

      userTx.forEach(t => {
        if (t.status === 'Approved') {
          runningTotal += t.amount;
        }

        let badgeClass = '';
        let statusBN = '';
        if (t.status === 'Canceled') { badgeClass = 'badge-canceled'; statusBN = 'ক্যানসেলড'; }
        else if (t.status === 'Pending') { badgeClass = 'badge-pending'; statusBN = 'পেন্ডিং'; }
        else if (t.status === 'Approved') { badgeClass = 'badge-approved'; statusBN = 'অ্যাপ্রুভড'; }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.date}</td>
          <td>${t.details}</td>
          <td>${t.senderBank}</td>
          <td>${t.receiverBank}</td>
          <td><span class="badge ${badgeClass}">${statusBN}</span></td>
          <td>৳ ${t.amount.toLocaleString('bn-BD')}</td>
          <td><strong>${t.status === 'Approved' ? '৳ ' + runningTotal.toLocaleString('bn-BD') : '-'}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>


  </div>

</body>
</html>
